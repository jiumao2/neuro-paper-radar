name: Refresh official paper data
on:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths: ['ingest/**', 'config/sources.json', '.github/workflows/refresh.yml']
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [auto, metadata, citations, repair, backfill]
        default: auto
permissions:
  contents: read
concurrency:
  group: official-data-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Metadata, daily citations, and weekly repair in one bounded pass
        env:
          REFRESH_MODE: ${{ inputs.mode || 'auto' }}
        run: python -m ingest.refresh --mode "$REFRESH_MODE"
      - run: python -m ingest.validate
      - name: Persist last-good state and public coverage
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/papers.json data/state.json.gz data/coverage.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh verified paper snapshot [skip ci]'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci && npm run build && node scripts/build-info.mjs
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist
  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
  live-qa:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci && npx playwright install --with-deps chromium
      - env:
          QA_BASE_URL: ${{ needs.deploy.outputs.page_url }}
        run: node scripts/qa-live.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: live-browser-evidence
          path: test-results/
          retention-days: 7
