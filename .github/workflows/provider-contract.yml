name: Check official provider contracts
on:
  push:
    branches: [main]
    paths: ['ingest/http.py', 'ingest/published_usage.py', 'ingest/probe_providers.py', '.github/workflows/provider-contract.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: provider-contract-check
  cancel-in-progress: false
jobs:
  provider-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Four bounded read-only requests; no separate schedule
        run: python -m ingest.probe_providers
